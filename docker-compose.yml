services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-secure_dms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: ${DB_NAME:-secure_dms_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secure_dms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - secure-dms-net

  # Dev-only SMTP catcher for invitation emails — web UI at :8025, SMTP on
  # :1025. No healthcheck (fire-and-forget dev tool); services/mail also
  # degrades gracefully to log-only if this isn't reachable.
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - secure-dms-net

  # Dev-only DB browser — web UI at :5050. Pre-registers the postgres
  # service below via servers.json so there's nothing to configure by
  # hand beyond the master password on first login.
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@securedms.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme_dev_only}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - secure-dms-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-secure_dms}:${DB_PASSWORD:-changeme_dev_only}@postgres:5432/${DB_NAME:-secure_dms_dev}
      STORAGE_ROOT_PATH: /data/storage
      PORT: 4000
      # Container-network DNS name — overrides .env's host-dev default (localhost)
      SMTP_HOST: mailhog
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - object_storage:/data/storage
    networks:
      - secure-dms-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}/api/v1
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - secure-dms-net

volumes:
  pgdata:
  # The "encrypted object storage" — a plain volume mounted into the api
  # container; the local-fs storage adapter reads/writes it via
  # STORAGE_ROOT_PATH. No MinIO/S3 service in Sprint 0 (per project
  # decision) — swap the adapter behind services/storage later without
  # touching this compose file's shape.
  object_storage:

networks:
  secure-dms-net:
    driver: bridge
